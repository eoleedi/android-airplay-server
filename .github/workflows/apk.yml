name: Android build and release

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android toolchain
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          test "$RELEASE_TAG" = "v$version" || { echo "Tag does not match versionName ($version)"; exit 1; }

      - name: Build and test debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --stacktrace

      - name: Build signed optimized release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          : "${RELEASE_KEYSTORE_BASE64:?Missing release keystore secret}"
          : "${RELEASE_STORE_PASSWORD:?Missing release store password}"
          : "${RELEASE_KEY_ALIAS:?Missing release key alias}"
          : "${RELEASE_KEY_PASSWORD:?Missing release key password}"
          umask 077
          trap 'rm -f "$RELEASE_STORE_FILE"' EXIT
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RELEASE_STORE_FILE"
          SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)
          export SOURCE_DATE_EPOCH
          ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace --no-daemon
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/airplay-tv-receiver-${RELEASE_TAG}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/airplay-tv-receiver-${RELEASE_TAG}.aab"
          cd dist
          sha256sum -- *.apk *.aab > SHA256SUMS

      - name: Upload debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: airplay-tv-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload release files
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/* --verify-tag --title "$RELEASE_TAG" --generate-notes
